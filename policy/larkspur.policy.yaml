# TESTIGO+ signed policy — the compiled output of the company's spoken mandate (F1).
# The interceptor enforces this; the agent cannot change it. Values are simulated.
# The delivery destination is tied by name AND address (F1-D2): the address is
# not spoken in the demo phrase, so it is taken from the buyer profile
# (common/config.py BUYER) and marked simulated. Amounts are integer cents.
version: 1
owner: larkspur
source: voice
transcript: "Only ship to our warehouse, at most fifteen hundred dollars per order"
rules:
  - deliver_only:
      - name: "Larkspur Market"
        address: "120 Harbor Road, Unit 4, Riverton"
  - max_per_order_cents: 150000
  - ask_before: new_address
signed_by: passkey:larkspur
