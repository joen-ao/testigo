[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "testigo"
version = "0.1.0"
description = "TESTIGO+: an independent, pixel-level witness for computer-use AI agents (simulated supplier orders, protected delivery address)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "openai",
    "playwright",
    "fastapi",
    "uvicorn",
    "websockets",
    "cryptography",
    "pyyaml",
    "pillow",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
testigo = "app.security.verifier.cli:main"

[tool.setuptools]
packages = ["app", "app.common", "app.core", "app.core.policy", "app.core.decision", "app.core.evidence",
            "app.core.approvals", "app.adapters", "app.adapters.meta", "app.adapters.browser", "app.runtime",
            "app.runtime.loop", "app.runtime.service", "app.runtime.mcp", "app.security", "app.security.verifier",
            "app.sim", "app.sim.portal", "gate", "scripts", "bench"]

[tool.setuptools.package-data]
"app.sim.portal" = ["static/*.png"]
"app.core.policy" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "app", "bench", "gate"]
python_files = ["test_*.py"]
addopts = "-m 'not live'"
markers = [
    "live: calls real Meta models (needs .env); run with `make test-live`",
    "browser: opens Chromium through Playwright, no models",
]
