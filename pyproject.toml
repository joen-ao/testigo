[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "testigo"
version = "0.1.0"
description = "TESTIGO+: an independent, pixel-level witness for computer-use AI agents (simulated payments)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "openai",
    "playwright",
    "fastapi",
    "uvicorn",
    "websockets",
    "cryptography",
    "pyyaml",
    "pillow",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
testigo = "receipts.cli:main"

[tool.setuptools]
packages = ["common", "portal", "agent", "interceptor", "receipts", "policy", "approval", "gate", "scripts"]

[tool.setuptools.package-data]
portal = ["static/*.png"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "common", "portal", "interceptor", "agent", "receipts", "approval", "policy"]
python_files = ["test_*.py"]
addopts = "-m 'not live'"
markers = [
    "live: calls real Meta models (needs .env); run with `make test-live`",
    "browser: opens Chromium through Playwright, no models",
]
